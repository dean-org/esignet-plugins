spring.application.name=csv-xl-plugin

# Select this plugin as the active authenticator
mosip.esignet.integration.authenticator=ExcelAuthenticationService

# Path to your identity data file on the server (mount/copy it here).
# File type is auto-detected from the extension:
#   .xlsx / .xls -> read as Excel
#   .csv         -> read as CSV
# Examples:
#   mosip.esignet.authenticator.excel.file-path=/opt/esignet/config/identities.xlsx
#   mosip.esignet.authenticator.excel.file-path=/opt/esignet/config/identities.csv
mosip.esignet.authenticator.excel.file-path=/opt/esignet/config/identities.xlsx

# Leave blank to use the first sheet in the workbook. Ignored for CSV files.
mosip.esignet.authenticator.excel.sheet-name=

# Which excel column holds the value the user types as their "individual id" at login
mosip.esignet.authenticator.excel.auth-factor.kbi.individual-id-field=id

# Which excel column is the unique record id used internally as kycToken
mosip.esignet.authenticator.excel.entity-id-field=entityId

# All fields eSignet's KBI screen can ask for. 'id' MUST also appear here
# and must match individual-id-field above.
mosip.esignet.authenticator.excel.auth-factor.kbi.field-details={{'id':'id'},{'id':'fullName'},{'id':'dob'}}

# Maps OIDC claim names -> excel column names, for the userinfo/kyc response
mosip.esignet.authenticator.excel.identity-openid-claims-mapping={'name':'fullName','birthdate':'dob','phone_number':'phone','email':'email'}